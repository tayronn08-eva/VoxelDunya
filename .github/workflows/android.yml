
name: Android APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-24.04
    container:
      image: barichello/godot-ci:4.3

    steps:
      - name: Download project
        uses: actions/checkout@v4

      - name: Create Android preset
        run: |
          cat > export_presets.cfg <<'EOF'
          [preset.0]
          name="Android"
          platform="Android"
          runnable=true
          dedicated_server=false
          custom_features=""
          export_filter="all_resources"
          include_filter=""
          exclude_filter=""
          export_path=""
          patches=PackedStringArray()
          encryption_include_filters=""
          encryption_exclude_filters=""
          [preset.0.options]
          custom_template/debug=""
          custom_template/release=""
          gradle_build/use_gradle_build=false
          architectures/armeabi-v7a=false
          architectures/arm64-v8a=true
          version/code=1
          version/name="1.0"
          package/unique_name="com.tayron.voxeldunya"
          package/name="Voxel Dunya"
          package/signed=true
          EOF

      - name: Import project
        run: godot --headless --editor --path . --quit

      - name: Build APK
        run: |
          mkdir -p build
          godot --headless --path . --export-debug "Android" build/VoxelDunya.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: VoxelDunya-APK
          path: build/VoxelDunya.apk
          
